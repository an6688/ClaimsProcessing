name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI_Only_Synthetic_123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI_Only_Synthetic_123!' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=20 --health-start-period=30s
    env:
      CLAIMS_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=CI_Only_Synthetic_123!;Encrypt=True;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ClaimsProcessing.sln
      - run: dotnet build ClaimsProcessing.sln -c Release --no-restore
      - run: dotnet test ClaimsProcessing.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
